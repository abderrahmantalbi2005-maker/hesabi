<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF1F4;--card:#FFFFFF;--text:#0E1A2B;--muted:#66758A;--accent:#1E8F6F;--on:#FFFFFF;--line:#DDE4EB;--red:#B93A4A;--green:#1E8F6F;--gold:#C8A04A;--btn:#16345A;--btn-on:#FFFFFF;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A101C;--card:#121B2C;--text:#E8EDF5;--muted:#8E9BB0;--accent:#3FBF98;--on:#06241B;--line:#22304A;--red:#F08A96;--green:#4AD3A5;--btn:#3FBF98;--btn-on:#06241B}}
:root[data-theme="dark"]{--bg:#0A101C;--card:#121B2C;--text:#E8EDF5;--muted:#8E9BB0;--accent:#3FBF98;--on:#06241B;--line:#22304A;--red:#F08A96;--green:#4AD3A5;--btn:#3FBF98;--btn-on:#06241B}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;font-size:15px;display:flex;justify-content:center;-webkit-font-smoothing:antialiased}
#app{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column}
#screen{flex:1;overflow-y:auto;padding:14px 14px 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center}
.muted{color:var(--muted);font-size:.85rem}
h2{font-weight:700}h3{margin:0 0 10px;font-size:.98rem;font-weight:600}
input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:14px;padding:13px 14px;font:inherit}
input:focus{outline:2px solid var(--gold);outline-offset:1px}
button{font:inherit;border:0;border-radius:12px;cursor:pointer}
.hero{position:relative;overflow:hidden;border-radius:24px;padding:16px 18px 10px;margin-bottom:16px;color:#fff;background:linear-gradient(150deg,#0E1A2B 0%,#16345A 68%,#1F4B7A 100%);box-shadow:0 16px 34px rgba(14,26,43,.32)}
.hero .gl{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero>*:not(.gl){position:relative}
.hero .top{display:flex;justify-content:space-between;align-items:center}
.hero .lbl{font-size:.82rem;opacity:.78}
.hero .n{font-size:2.4rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.25;margin:8px 0 6px}
.hero .cu{font-size:.95rem;font-weight:500;color:#E3C77A;margin-inline-start:8px}
.hero .pill{display:inline-block;font-size:.8rem;padding:3px 12px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16)}
.hdr{display:flex;justify-content:space-between;align-items:center;margin:2px 2px 14px}.hdr h2{margin:0;font-size:1.35rem}
.gear2{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);color:var(--text)}
.gear2 svg{width:19px;height:19px}
.gear{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff}
.gear svg{width:19px;height:19px}
.spark{display:block;width:100%;height:44px;margin-top:8px}
.mic{width:50px;height:50px;border-radius:50%;background:linear-gradient(145deg,#E3C77A,#C8A04A);color:#2A1E05;display:grid;place-items:center;flex:none}
.mic svg{width:24px;height:24px}
.mic.rec{background:var(--red);color:#fff;animation:p 1s infinite}
@keyframes p{50%{transform:scale(1.1)}}
.btn{background:var(--btn);color:var(--btn-on);padding:11px 18px;font-weight:600}
.btn2{background:transparent;color:var(--text);padding:10px 16px;border:1px solid var(--line)}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.ib{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;border:1px solid var(--line);color:var(--muted)}
.ib svg{width:19px;height:19px}
.ib.in{color:var(--green)}.ib.out{color:var(--red)}.ib.debt{color:#A8801F}
.out{color:var(--red);font-weight:600;font-variant-numeric:tabular-nums}.in{color:var(--green);font-weight:600;font-variant-numeric:tabular-nums}
.chip{background:var(--card);border:1px solid var(--line);color:var(--text);padding:7px 13px;border-radius:999px;font-size:.85rem;margin:0 0 6px 6px}
.chip.act{background:var(--btn);color:var(--btn-on);border-color:var(--btn)}
.msg{padding:10px 13px;border-radius:16px;margin:8px 0;max-width:88%;white-space:pre-line;line-height:1.75}
.me{background:var(--btn);color:var(--btn-on);margin-inline-start:auto;border-end-start-radius:4px}
.ai{background:var(--card);border:1px solid var(--line);border-end-end-radius:4px}
.prev{border:1.5px solid var(--gold);background:color-mix(in srgb,var(--gold) 8%,var(--card))}
.prev p{margin:4px 0}
.note{font-size:.75rem;color:var(--muted);text-align:center;margin-top:6px}
nav{display:flex;background:var(--card);border-top:1px solid var(--line);padding:4px 4px 6px}
nav button{flex:1;position:relative;background:none;color:var(--muted);padding:8px 0 4px;font-size:.62rem;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:0}
nav button b{display:grid;place-items:center;font-weight:400}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--text);font-weight:600}
nav button.on svg{color:var(--accent)}
nav button.on::before{content:'';position:absolute;top:-5px;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--gold)}
.fab{position:fixed;inset-inline-end:-12px;bottom:34%;width:50px;height:50px;padding-inline-end:12px;border-radius:50%;background:linear-gradient(145deg,#E3C77A,#C8A04A);color:#2A1E05;display:grid;place-items:center;box-shadow:0 8px 20px rgba(14,26,43,.38);z-index:20}
.fab svg{width:22px;height:22px}
.fab.rec{background:var(--red);color:#fff;animation:p 1s infinite}
#toast{position:fixed;left:12px;right:12px;bottom:90px;max-width:440px;margin:auto;background:#0E1A2B;color:#fff;border-radius:14px;padding:10px 14px;z-index:30;display:none}
#toast .chip{margin:6px 0 0;background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
@media print{nav,.noprint,.fab,#toast{display:none!important}html,body{height:auto;display:block;background:#fff}#app{height:auto;max-width:none}#screen{overflow:visible;padding:0}.paper{border:0!important}}
</style>
</head>

let CURS=['USD','EUR','GBP','DZD','MAD','TND','EGP','SAR','AED','TRY','CHF','CAD','JPY','CNY','INR'];try{if(Intl.supportedValuesOf)CURS=Intl.supportedValuesOf('currency')}catch(e){}

function seed(){let r=7;const rnd=()=>{r=(r*16807)%2147483647;return r/2147483647};const out=[],Y=TODAY.getFullYear();
 const PP=[['طعام',['مطعم الأصالة','البقالة','سوق الخضار'],20000,90000],['مواصلات',['تاكسي','بنزين'],10000,50000],['فواتير',['فاتورة الكهرباء','الإنترنت'],60000,140000],['أدوية',['صيدلية الشفاء'],20000,90000],['صيانة',['المصلح فلان','فني السباكة'],40000,150000]];
 for(let y=Y-2;y<=Y;y++)for(let m=1;m<=12;m++){

 return t+'</div>'}

const RL=()=>({owner:L('مالك','Propriétaire','Owner'),entry:L('يُدخل العمليات','Saisit les opérations','Enters transactions'),approve:L('يعتمد العمليات','Valide les opérations','Approves transactions'),view:L('مشاهدة فقط (محاسب)','Lecture seule (comptable)','View only (accountant)')});
